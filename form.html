<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envie sua Review | ShelfSpace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="lidos.html">Lidos</a></li>
            <li><a href="lista.html">Lista de leitura</a></li>
            <li><a href="reviews.php">Reviews</a></li>
            <li><a href="about.html">Sobre</a></li>
            <li><a href="#" class="nav-conta">Minha Conta</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="form-section">

        <h1>Envie sua Review</h1>
        <p>Compartilhe sua opinião sobre um livro que marcou sua leitura.</p>

        <form id="reviewForm" action="formAction.html" method="GET">

            <label for="nome">Seu nome:</label>
            <input type="text" id="nome" name="nome">

            <label for="email">Seu e-mail:</label>
            <input type="email" id="email" name="email">

            <label for="livro">Título do livro:</label>
            <input type="text" id="livro" name="livro">

            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor">

            <label for="genero">Gênero:</label>
            <select id="genero" name="genero">
                <option value="">Selecione um gênero</option>
                <option value="Romance">Romance</option>
                <option value="Fantasia">Fantasia</option>
                <option value="Ficção Científica">Ficção Científica</option>
                <option value="Mistério">Mistério</option>
                <option value="Terror">Terror</option>
                <option value="Drama">Drama</option>
                <option value="Poesia">Poesia</option>
                <option value="Autoajuda">Autoajuda</option>
                <option value="Young Adult">Young Adult</option>
                <option value="Thriller">Thriller</option>
                <option value="Biografia"> Biografia</option>
                <option value="Clássicos">Clássicos</option>
            </select>

            <label for="nota">Nota:</label>
            <select id="nota" name="nota">
                <option value="">Selecione uma nota</option>
                <option value="1">1 estrela</option>
                <option value="2">2 estrelas</option>
                <option value="3">3 estrelas</option>
                <option value="4">4 estrelas</option>
                <option value="5">5 estrelas</option>
            </select>

            <label for="review">Sua review:</label>
            <textarea id="review" name="review" rows="6"></textarea>

            <div class="checkbox-area">
                <input type="checkbox" id="confirmacao" name="confirmacao" value="sim">
                <label for="confirmacao">Confirmo que quero enviar minha review.</label>
            </div>

            <p id="mensagemErro"></p>

            <button type="submit">Enviar Review</button>

        </form>

    </section>

</main>

<footer>
    <p>📚 ShelfSpace — sua biblioteca digital</p>

</footer>

</body>
</html>
